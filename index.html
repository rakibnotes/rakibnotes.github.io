<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Study Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
            color: #ccc;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .subject {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .subject:hover {
            transform: translateY(-3px);
        }

        .subject h3 {
            margin-top: 0;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Study Hub</h1>
        <p>My personal collection of study notes</p>
    </header>

    <main>

        <h2>Subjects</h2>

        <div class="subjects">

            <a class="subject" href="#">
                <h3>🇩🇪 German</h3>
                <p>A0 → B1</p>
            </a>

            <a class="subject" href="#">
                <h3>🇬🇧 English / IELTS</h3>
                <p>Grammar, vocabulary and IELTS</p>
            </a>

            <a class="subject" href="#">
                <h3>💻 Cybersecurity</h3>
                <p>IT, networking, Linux and security</p>
            </a>

        </div>

    </main>

    <footer>
        Personal Study Hub
    </footer>

</body>

</html>
